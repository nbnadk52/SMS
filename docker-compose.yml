services:
  db:
    image: postgres:17
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms
      # Local development only. Use `dotnet user-secrets` or a secure configuration
      # provider for any non-local environment.
      POSTGRES_PASSWORD: sms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sms-postgres-data:
